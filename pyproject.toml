[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sessiongit"
version = "0.3.0"
description = "Version control for AI conversations - track, search, and resume coding sessions with any AI assistant"
authors = [{name = "SessionGit Contributors"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "watchdog>=3.0.0",
    "mcp>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/cliffhangerchaos-cloud/sessiongit"
Issues = "https://github.com/cliffhangerchaos-cloud/sessiongit/issues"

[project.scripts]
sessiongit = "sessiongit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
